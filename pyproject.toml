[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "executive-compensation-disclosures"
version = "0.1.0"
description = "Evidence-preserving, deterministic executive disclosure collection"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11"]

[project.scripts]
execcomp = "execcomp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
